[project]
name = "argus"
version = "0.1.0"
description = "Multi-camera RTSP surveillance with face recognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9",
    "face-recognition>=1.3",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    "setuptools<81",
    "numpy>=1.26",
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Beefy-hardware backends. Base install only ships dlib_hog (works everywhere).
gpu = [
    "insightface",
    "onnxruntime-gpu",
]
facenet = [
    "torch",
    "facenet-pytorch",
]

[project.scripts]
argus = "main:main"
